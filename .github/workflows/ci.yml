name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  engineering:
    name: Engineering checks (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 was deprecated on GitHub Actions hosted runners on
        # 2025-09-19; see
        # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
        # We test on the LTS line that still works on the runner
        # images (Node 22 and Node 24). package.json still declares
        # "engines": { "node": ">=20" } so local Node 20 keeps working;
        # CI does not block on the deprecated runner image.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # setup-node@v4 rejects `cache: 'none'` (see actions/setup-node PR #917).
          # Omit the field instead — package.json has no npm deps so no
          # cache is needed.
      - name: Debug Node 22 environment (probes ci #N red)
        if: matrix.node == 22
        run: |
          echo "=== node version ==="
          node --version
          echo "=== npm version ==="
          npm --version
          echo "=== process.env.CI ==="
          echo "CI=$CI"
          echo "GITHUB_ACTIONS=$GITHUB_ACTIONS"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "=== shell expansion of glob ==="
          echo "tests/*.test.mjs count:"
          ls tests/*.test.mjs 2>&1 | wc -l
          echo "first 5 files bash sees:"
          ls tests/*.test.mjs 2>&1 | head -5
          echo "=== what node --test sees directly ==="
          node --print "process.argv.slice(2)" --test tests/*.test.mjs || true
          echo "=== node --test tests/ behavior ==="
          timeout 30 node --test --test-reporter=spec tests/ 2>&1 | tail -30 || echo "(timed out or failed)"
          echo "=== single integration test in isolation ==="
          CI=true timeout 30 node --test --test-reporter=spec tests/integration.test.mjs 2>&1 | tail -30 || echo "(timed out or failed)"
          echo "=== npm test under CI=true, raw output ==="
          CI=true timeout 120 npm test -- --test-reporter=spec 2>&1 | tail -50 || echo "(timed out or failed)"
          echo "=== done ==="
      - name: Syntax check
        run: node scripts/check-syntax.mjs
      - name: Boundary contract check
        run: node scripts/check-boundaries.mjs
      - name: Format check
        run: node scripts/check-format.mjs
      - name: Version / CHANGELOG check
        run: node scripts/check-version.mjs
      - name: Test (zero runtime deps; uses node built-ins only)
        run: npm test
      - name: Release dry-run
        run: node scripts/release-dry-run.mjs

  devflow-runtime:
    name: DevFlow Runtime pytest (Ubuntu, Python 3.11)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout workbench-agent
        uses: actions/checkout@v4
        with:
          lfs: false
          path: workbench-agent
      - name: Checkout sister repo (devflow-runtime)
        uses: actions/checkout@v4
        with:
          repository: xue1long/devflow-runtime
          path: devflow-runtime
          lfs: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime + test deps
        working-directory: devflow-runtime
        run: |
          python -m pip install -e '.[test]'
      - name: Pytest
        working-directory: devflow-runtime
        run: python -m pytest -q
