name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  engineering:
    name: Engineering checks (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 was deprecated on GitHub Actions hosted runners on
        # 2025-09-19; see
        # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
        # We test on the LTS line that still works on the runner
        # images (Node 22 and Node 24). package.json still declares
        # "engines": { "node": ">=20" } so local Node 20 keeps working;
        # CI does not block on the deprecated runner image.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # setup-node@v4 rejects `cache: 'none'` (see actions/setup-node PR #917).
          # Omit the field instead — package.json has no npm deps so no
          # cache is needed.
      - name: Syntax check
        run: node scripts/check-syntax.mjs
      - name: Boundary contract check
        run: node scripts/check-boundaries.mjs
      - name: Format check
        run: node scripts/check-format.mjs
      - name: Version / CHANGELOG check
        run: node scripts/check-version.mjs
      - name: Test (zero runtime deps; uses node built-ins only)
        run: npm test
      - name: Release dry-run
        run: node scripts/release-dry-run.mjs

  devflow-runtime:
    name: DevFlow Runtime pytest (Ubuntu, Python 3.11)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout workbench-agent
        uses: actions/checkout@v4
        with:
          lfs: false
          path: workbench-agent
      - name: Checkout sister repo (devflow-runtime)
        uses: actions/checkout@v4
        with:
          repository: xue1long/devflow-runtime
          path: devflow-runtime
          lfs: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply workbench-agent-local patches to sister repo
        # The sister repo (xue1long/devflow-runtime) has known-good fixes
        # (clock staleness + session isolation) that we depend on but
        # haven't been pushed yet. Apply them idempotently from inside the
        # sister repo's working directory, using `git apply -p1` to strip
        # the patch's `a/`/`b/` prefixes.
        #
        # Idempotency: try `git apply --reverse --check` first; if it
        # succeeds, the patch is already applied. Otherwise try forward.
        # Both branches log clearly so a real conflict is visible.
        run: |
          set -e
          cd ../devflow-runtime
          for p in ../workbench-agent/.devflow-runtime-patches/*.patch; do
            [ -f "$p" ] || continue
            echo "checking patch: $(basename "$p")"
            if git apply --reverse --check -p1 "$p" 2>/dev/null; then
              echo "  already applied (skipping)"
            elif git apply --check -p1 "$p" 2>/dev/null; then
              git apply -p1 "$p"
              echo "  applied"
            else
              echo "  CONFLICT: patch neither applies nor reverses cleanly"
              git apply --check -p1 "$p" || true
              exit 1
            fi
          done
      - name: Install runtime + test deps
        working-directory: devflow-runtime
        run: |
          python -m pip install -e '.[test]'
      - name: Pytest
        working-directory: devflow-runtime
        run: python -m pytest -q
